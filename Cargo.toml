[package]
name = "fetchx-drm-plugin"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "fetchx-drm-plugin"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "io-std", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
base64 = "0.22"
thiserror = "1"
async-trait = "0.1"

# Crypto — required by local_cdm.rs (OpenWV algorithms)
prost = "0.13"
rsa = { version = "0.9", features = ["sha1", "sha2"] }
sha1 = "0.10"
sha2 = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
cmac = "0.7"
hmac = "0.12"
rand = { version = "0.8", features = ["getrandom"] }
byteorder = "1"

# ZIP parsing for .prd files
zip = { version = "2", default-features = false, features = ["deflate"] }
